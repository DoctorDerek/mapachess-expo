name: ESLint and TypeScript Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Node Version
        id: node-version
        shell: bash
        run: |
          node_version="$(tr -d '\r\n[:space:]' < .node-version)"

          if [[ ! "$node_version" =~ ^v?24([.][0-9]+){0,2}$ ]]; then
            echo "Expected .node-version to select Node 24."
            exit 1
          fi

          echo "value=${node_version#v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false
          runtime: node@${{ steps.node-version.outputs.value }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint and Capture Advisory Output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/eslint-output.txt"
          lint_exit_code="${PIPESTATUS[0]}"
          set -e

          echo "exit-code=$lint_exit_code" >> "$GITHUB_OUTPUT"

      - name: Post ESLint Advisory Comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ESLINT_EXIT_CODE: ${{ steps.lint.outputs.exit-code }}
          ESLINT_OUTPUT_FILE: ${{ runner.temp }}/eslint-output.txt
        with:
          retries: 3
          script: |
            const fs = require("node:fs")
            const marker = "<!-- mapachess-eslint-advisory -->"
            const header = "### 🧹 ESLint"
            const outputPath = process.env.ESLINT_OUTPUT_FILE
            const rawOutput = outputPath && fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, "utf8")
              : ""
            const cleanOutput = rawOutput
              .replace(/\u001b\[[0-9;]*m/g, "")
              .replaceAll("```", "ˋˋˋ")
              .trim()
            const displayedOutput = cleanOutput.length > 58_000
              ? `…\n${cleanOutput.slice(-58_000)}`
              : cleanOutput
            const exitCode = Number.parseInt(
              process.env.ESLINT_EXIT_CODE ?? "",
              10,
            )
            let status

            if (!Number.isInteger(exitCode) || exitCode !== 0) {
              status = "❌ **ESLint could not run.**"
            } else if (displayedOutput) {
              status = "⚠️ **ESLint completed with advisory findings.**"
            } else {
              status = "✅ **Zero warnings.**"
            }

            const outputBlock = displayedOutput
              ? `\n\n\`\`\`text\n${displayedOutput}\n\`\`\``
              : ""
            const body = `${marker}\n${header}\n\n${status}${outputBlock}`
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker),
            )

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            }

      - name: Run Blocking TypeScript Typecheck
        run: pnpm typecheck

      - name: Enforce ESLint Runner Health
        if: always()
        shell: bash
        env:
          ESLINT_EXIT_CODE: ${{ steps.lint.outputs.exit-code }}
        run: |
          if [[ ! "$ESLINT_EXIT_CODE" =~ ^[0-9]+$ ]] || [[ "$ESLINT_EXIT_CODE" -ne 0 ]]; then
            echo "ESLint could not run."
            exit 1
          fi
