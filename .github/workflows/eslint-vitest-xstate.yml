name: ESLint, Vitest, and XState Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Node Version
        id: node-version
        shell: bash
        run: |
          node_version="$(tr -d '\r\n[:space:]' < .node-version)"

          if [[ ! "$node_version" =~ ^v?24([.][0-9]+){0,2}$ ]]; then
            echo "Expected .node-version to select Node 24."
            exit 1
          fi

          echo "value=${node_version#v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false
          runtime: node@${{ steps.node-version.outputs.value }}

      - name: Install Dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint and Capture Advisory Output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/eslint-output.txt"
          lint_exit_code="${PIPESTATUS[0]}"
          set -e

          echo "exit-code=$lint_exit_code" >> "$GITHUB_OUTPUT"

      - name: Post ESLint Advisory Comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ESLINT_EXIT_CODE: ${{ steps.lint.outputs.exit-code }}
          ESLINT_OUTPUT_FILE: ${{ runner.temp }}/eslint-output.txt
        with:
          retries: 3
          script: |
            const fs = require("node:fs")
            const marker = "<!-- mapachess-eslint-advisory -->"
            const header = "### 🧹 ESLint"
            const outputPath = process.env.ESLINT_OUTPUT_FILE
            const rawOutput = outputPath && fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, "utf8")
              : ""
            const cleanOutput = rawOutput
              .replace(/\u001b\[[0-9;]*m/g, "")
              .replaceAll("```", "ˋˋˋ")
              .trim()
            const hasFindings =
              /\b\d+ problems? \(\d+ errors?, \d+ warnings?\)/.test(
                cleanOutput,
              )
            const displayedOutput = cleanOutput.length > 58_000
              ? `…\n${cleanOutput.slice(-58_000)}`
              : cleanOutput
            const exitCode = Number.parseInt(
              process.env.ESLINT_EXIT_CODE ?? "",
              10,
            )
            let status

            if (!Number.isInteger(exitCode) || exitCode !== 0) {
              status = "❌ **ESLint could not run.**"
            } else if (hasFindings) {
              status = "⚠️ **ESLint completed with advisory findings.**"
            } else {
              status = "✅ **Zero warnings.**"
            }

            const outputBlock =
              displayedOutput && (exitCode !== 0 || hasFindings)
              ? `\n\n\`\`\`text\n${displayedOutput}\n\`\`\``
              : ""
            const body = `${marker}\n${header}\n\n${status}${outputBlock}`
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker),
            )

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            }

      - name: Run Blocking TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Blocking Tests and Measure Coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:coverage --continue=dependencies-successful

      - name: Run Blocking XState Analyzer Tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:xstate-diff

      - name: Run Blocking Lighthouse Tooling Tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test:lighthouse

      - name: Inventory Vitest Coverage Evidence
        id: coverage-evidence
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs")
            const path = require("node:path")
            const owners = ["."]
            for (const parent of ["apps", "packages"]) {
              if (!fs.existsSync(parent)) continue
              for (const entry of fs.readdirSync(parent, { withFileTypes: true })) {
                const owner = `${parent}/${entry.name}`
                const manifest = `${owner}/package.json`
                if (!entry.isDirectory() || !fs.existsSync(manifest)) continue
                const scripts = JSON.parse(fs.readFileSync(manifest, "utf8")).scripts
                if (scripts?.["test:coverage"]?.includes("vitest")) owners.push(owner)
              }
            }
            const available = []
            const evidence = owners.map(owner => {
              const file = `${owner}/coverage/lcov.info`
              const content = fs.existsSync(file) ? fs.readFileSync(file, "utf8") : ""
              const sources = [...content.matchAll(/^SF:(.+)$/gm)].map(match => match[1].trim())
              const missingSources = sources.filter(source =>
                !fs.existsSync(path.resolve(owner, source)) && !fs.existsSync(path.resolve(source)),
              )
              const present = sources.length > 0 && content.includes("end_of_record")
              if (present) available.push(file)
              if (!present || missingSources.length) core.warning(`Incomplete coverage evidence: ${file}; unresolved sources: ${missingSources.length}`)
              return { file, present, sourceCount: sources.length, missingSources }
            })
            const complete = evidence.every(report => report.present && report.missingSources.length === 0)
            fs.mkdirSync("coverage-evidence", { recursive: true })
            fs.writeFileSync("coverage-evidence/vitest.json", JSON.stringify({ sha: context.sha, flag: "vitest", complete, reports: evidence }, null, 2))
            core.setOutput("files", available.join(","))
            await core.summary.addHeading("Vitest coverage evidence")
              .addRaw(`Commit: ${context.sha}. ${complete ? "All expected reports found with resolvable source paths." : "INCOMPLETE: missing evidence is unavailable, not zero coverage; do not compare this as a complete baseline."}`)
              .addTable([["Report", "Available", "Source paths missing"], ...evidence.map(report => [report.file, String(report.present), String(report.missingSources.length)])]).write()

      - name: Preserve Vitest Coverage Evidence
        if: ${{ !cancelled() && steps.coverage-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage-evidence
          path: |
            coverage-evidence/vitest.json
            coverage/lcov.info
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Measured Coverage to Codecov
        if: ${{ !cancelled() && steps.coverage-evidence.outputs.files != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ${{ steps.coverage-evidence.outputs.files }}
          flags: vitest
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce ESLint Runner Health
        if: always()
        shell: bash
        env:
          ESLINT_EXIT_CODE: ${{ steps.lint.outputs.exit-code }}
        run: |
          if [[ ! "$ESLINT_EXIT_CODE" =~ ^[0-9]+$ ]] || [[ "$ESLINT_EXIT_CODE" -ne 0 ]]; then
            echo "ESLint could not run."
            exit 1
          fi

  native-jest:
    name: Native Jest Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Node Version
        id: node-version
        shell: bash
        run: |
          node_version="$(tr -d '\r\n[:space:]' < .node-version)"

          if [[ ! "$node_version" =~ ^v?24([.][0-9]+){0,2}$ ]]; then
            echo "Expected .node-version to select Node 24."
            exit 1
          fi

          echo "value=${node_version#v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false
          runtime: node@${{ steps.node-version.outputs.value }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Native Jest Coverage
        run: pnpm --filter @mapachess/mobile test:native:coverage

      - name: Inventory Native Coverage Evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "### Native coverage evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA; flag: native" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s coverage/native/lcov.info ]] && grep -q '^SF:' coverage/native/lcov.info; then
            echo "Report available: coverage/native/lcov.info" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Native coverage is unavailable; do not treat it as zero or complete evidence."
            echo "INCOMPLETE: coverage/native/lcov.info unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve Native Coverage Evidence
        if: ${{ !cancelled() && hashFiles('coverage/native/lcov.info') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage-evidence
          path: coverage/native/lcov.info
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Native Coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage/native/lcov.info') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: ./coverage/native/lcov.info
          flags: native
          token: ${{ secrets.CODECOV_TOKEN }}

  xstate-analysis:
    name: Analyze XState v5 Topology
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Pull Request History
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Node Version
        id: node-version
        shell: bash
        run: |
          node_version="$(tr -d '\r\n[:space:]' < .node-version)"

          if [[ ! "$node_version" =~ ^v?24([.][0-9]+){0,2}$ ]]; then
            echo "Expected .node-version to select Node 24."
            exit 1
          fi

          echo "value=${node_version#v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false
          runtime: node@${{ steps.node-version.outputs.value }}

      - name: Install Analysis Dependencies Without Lifecycle Scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Static XState v5 Diff
        continue-on-error: true
        run: pnpm xstate:diff
        env:
          XSTATE_DIFF_ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          XSTATE_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          XSTATE_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          XSTATE_DIFF_OUTPUT_DIRECTORY: xstate-diff-artifacts

      - name: Upload XState Diff Artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xstate-v5-state-machine-diff
          path: xstate-diff-artifacts/
          if-no-files-found: warn
          retention-days: 14

  xstate-publish:
    name: Publish XState v5 Diff Visualization
    needs: xstate-analysis
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download XState Diff Artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xstate-v5-state-machine-diff
          path: xstate-diff-artifacts

      - name: Publish Stable XState Diff Comment
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fs = require("node:fs")
            const marker = "<!-- xstate-v5-change-map -->"
            const header = "### 🗺️ XState v5 State Machine Diff Visualization"
            const commentPath = "xstate-diff-artifacts/comment.md"
            const maximumCommentBytes = 60_000
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            const fallbackBody = `${marker}\n${header}\n\n**Architecture visualization**\n\n⚠️ **Static XState analysis is unavailable.**\n\n[Inspect workflow run](${runUrl})`
            let body = fallbackBody

            if (fs.existsSync(commentPath)) {
              const candidateBody = fs.readFileSync(commentPath, "utf8").trim()
              const isValid =
                Buffer.byteLength(candidateBody, "utf8") <= maximumCommentBytes &&
                candidateBody.startsWith(marker) &&
                candidateBody.includes(header)

              if (isValid) {
                body = candidateBody
              } else {
                core.warning("Rejected an invalid or oversized XState diff comment artifact.")
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const botComment = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(marker),
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            }
