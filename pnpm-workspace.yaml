packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@swc/core": true
  esbuild: true

overrides:
  "brace-expansion@1.1.18": "1.1.21"
  "brace-expansion@5.0.9": "5.0.12"
  "compression@1.8.1": "1.8.2"
  "node-forge@1.4.0": "1.4.3"
  "shell-quote@1.10.0": "1.11.0"
  "source-map-js@1.2.1": "1.2.2"
  "zod@4.6.5": "4.6.6"
  "xcode@3.0.1>uuid": "11.1.1"

disallowWorkspaceCycles: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.20"
  - "@expo/env@2.4.3"
  - "@expo/fingerprint@0.20.11"
  - "@expo/metro-config@57.0.12"
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18
